<app-header></app-header>
<div class="page-container">
    <div class="card">
        <h2 class="form-title">Formulário</h2>
        <p class="form-subtitle">Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor
            incididunt ut labore et dolore magna aliqua.</p>

        <form [formGroup]="form">
            <!-- Campo Nome -->
            <div class="form-group">
                <label for="nome" class="form-label">Nome <span class="required">*</span></label>
                <input type="text" id="nome" class="br-input" formControlName="nome"
                    [class.is-invalid]="isFieldInvalid('nome')" />
                <div *ngIf="isFieldInvalid('nome')" class="error-message">
                    {{ getErrorMessage('nome') }}
                </div>
            </div>

            <!-- Campo CPF -->
            <div class="form-group">
                <label for="cpf" class="form-label">CPF <span class="required">*</span></label>
                <input type="text" id="cpf" class="br-input" formControlName="cpf" mask="000.000.000-00"
                    [class.is-invalid]="isFieldInvalid('cpf')" />
                <div *ngIf="isFieldInvalid('cpf')" class="error-message">
                    {{ getErrorMessage('cpf') }}
                </div>
            </div>

            <!-- Campo Email -->
            <div class="form-group">
                <label for="email" class="form-label">Email <span class="required">*</span></label>
                <input type="email" id="email" class="br-input" formControlName="email"
                    [class.is-invalid]="isFieldInvalid('email')" />
                <div *ngIf="isFieldInvalid('email')" class="error-message">
                    {{ getErrorMessage('email') }}
                </div>
            </div>
        </form>

        <!-- Rodapé com botões -->
        <div class="form-footer">
            <button class="br-button secondary" type="button" (click)="voltar()">
                Voltar
            </button>
            <button class="br-button primary" type="button" (click)="abrirModal()">
                Confirmar envio ✓
            </button>
        </div>
    </div>
</div>

<!-- Modal de Confirmação -->
<div class="modal-overlay" *ngIf="modalAberto" (click)="fecharModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <div class="modal-body">
            <p class="modal-text">Gostaria de confirmar o envio desse formulário?</p>
        </div>
        <div class="modal-footer">
            <button class="br-button secondary" type="button" (click)="fecharModal()">
                Negar
            </button>
            <button class="br-button primary" type="button" (click)="confirmarEnvio()">
                Confirmar
            </button>
        </div>
    </div>
</div>
